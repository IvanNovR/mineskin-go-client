version: "2"

run:
  build-tags:
    - live

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - bodyclose
    - noctx
    - misspell
    - revive
    - nolintlint

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/IvanNovR/mineskin-go-client
