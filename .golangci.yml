version: "2"

run:
  build-tags:
    - live

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - bodyclose
    - noctx
    - misspell
    - revive
    - nolintlint
    - modernize
    - gocritic
    - thelper
    - usetesting
    - unconvert
    - unparam
    - errname
    - exhaustive
    - sloglint
    - perfsprint
  settings:
    exhaustive:
      default-signifies-exhaustive: true

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/IvanNovR/mineskin-go-client
