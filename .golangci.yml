version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - bodyclose
    - noctx
    - misspell
    - revive
    - nolintlint
  settings:
    revive:
      rules:
        - name: exported

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/IvanNovR/mineskin-go-client
