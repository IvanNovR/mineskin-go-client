# CI for the MineSkin Go client.
#
# Hardening: every action is pinned to a full commit SHA, the workflow token is
# read-only, credentials are not persisted, and untrusted values (PR title,
# SHAs) reach scripts only through env:, never through ${{ }} inside run:. Commit
# lint lives in commitlint.yml so PR title edits never touch these checks.
#
# Also called by release.yml (workflow_call) on the exact commit being released.
# Only pull_request runs cancel an older run in the same group, so a later push
# to main never cancels the CI of a release that is still running.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to check out; empty means the triggering ref.
        type: string
        required: false
        default: ""

permissions: {}

env:
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go.mod minimum
            go-version: ""
            go-version-file: go.mod
          - name: stable
            go-version: stable
            go-version-file: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Vet live tests
        run: go vet -tags live ./...
      - name: Test with coverage gate
        run: make cover

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile (Dependabot
          # does not bump that one).
          version: v2.15.0

  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          test -z "$(git status --porcelain)"

  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Lint workflows
        # Keep in sync with ACTIONLINT_VERSION in the Makefile.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
